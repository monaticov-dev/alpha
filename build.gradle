    '-Dfile.encoding=UTF-8',
    '-Djava.system.class.loader=com.gtnewhorizons.retrofuturabootstrap.RfbSystemClassLoader',
    // Suppress the CDS warning caused by the custom system class loader
    '-Xlog:cds*=error',
    '--enable-native-access', 'ALL-UNNAMED',
    '--add-opens', 'java.base/java.io=ALL-UNNAMED',
    '--add-opens', 'java.base/java.lang.invoke=ALL-UNNAMED',
    '--add-opens', 'java.base/java.lang.ref=ALL-UNNAMED',
    '--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED',
    '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
    '--add-opens', 'java.base/java.net.spi=ALL-UNNAMED',
    '--add-opens', 'java.base/java.net=ALL-UNNAMED',
    '--add-opens', 'java.base/java.nio.channels=ALL-UNNAMED',
    '--add-opens', 'java.base/java.nio.charset=ALL-UNNAMED',
    '--add-opens', 'java.base/java.nio.file=ALL-UNNAMED',
    '--add-opens', 'java.base/java.nio=ALL-UNNAMED',
    '--add-opens', 'java.base/java.text=ALL-UNNAMED',
    '--add-opens', 'java.base/java.time.chrono=ALL-UNNAMED',
    '--add-opens', 'java.base/java.time.format=ALL-UNNAMED',
    '--add-opens', 'java.base/java.time.temporal=ALL-UNNAMED',
    '--add-opens', 'java.base/java.time.zone=ALL-UNNAMED',
    '--add-opens', 'java.base/java.time=ALL-UNNAMED',
    '--add-opens', 'java.base/java.util.concurrent.atomic=ALL-UNNAMED',
    '--add-opens', 'java.base/java.util.concurrent.locks=ALL-UNNAMED',
    '--add-opens', 'java.base/java.util.jar=ALL-UNNAMED',
    '--add-opens', 'java.base/java.util.zip=ALL-UNNAMED',
    '--add-opens', 'java.base/java.util=ALL-UNNAMED',
    '--add-opens', 'java.base/jdk.internal.loader=ALL-UNNAMED',
    '--add-opens', 'java.base/jdk.internal.misc=ALL-UNNAMED',
    '--add-opens', 'java.base/jdk.internal.ref=ALL-UNNAMED',
    '--add-opens', 'java.base/jdk.internal.reflect=ALL-UNNAMED',
    '--add-opens', 'java.base/sun.nio.ch=ALL-UNNAMED',
    '--add-opens', 'java.desktop/com.sun.imageio.plugins.png=ALL-UNNAMED',
    '--add-opens', 'java.desktop/sun.awt.image=ALL-UNNAMED',
    '--add-opens', 'java.desktop/sun.awt=ALL-UNNAMED',
    '--add-opens', 'java.sql.rowset/javax.sql.rowset.serial=ALL-UNNAMED',
    '--add-opens', 'jdk.dynalink/jdk.dynalink.beans=ALL-UNNAMED',
    '--add-opens', 'jdk.naming.dns/com.sun.jndi.dns=ALL-UNNAMED,java.naming',
]

def mcpTasks = extensions.getByType(MCPTasks)
def mcTasks = extensions.getByType(MinecraftTasks)
def modernJavaToolchain = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(25)
}

def configureModernRun = { RunMinecraftTask task, Distribution side ->
    task.setup(project)
    task.group = 'Modded Minecraft'
    task.dependsOn(mcpTasks.launcherSources.classesTaskName, mcTasks.taskDownloadVanillaAssets, mcpTasks.taskPackagePatchedMc, tasks.named('jar'))
    task.username = minecraft.username
    task.userUUID = minecraft.userUUID
    task.lwjglVersion = 3
    task.javaLauncher = modernJavaToolchain
    // forgePatches first, then launcher/patched MC/mod/dependencies
    task.classpath(configurations.modernJavaPatchDependencies)
    task.classpath(mcpTasks.taskPackageMcLauncher)
    task.classpath(mcpTasks.taskPackagePatchedMc)
    task.classpath(mcpTasks.patchedConfiguration)
    task.classpath(tasks.named('jar'))
    task.classpath(configurations.modernJavaDependencies)
    task.mainClass = (side == Distribution.CLIENT) ? 'GradleStart' : 'GradleStartServer'
    // Route launching through RetroFuturaBootstrap instead of launchwrapper
    task.systemProperty('gradlestart.bouncerClient', 'com.gtnewhorizons.retrofuturabootstrap.MainStartOnFirstThread')
    task.systemProperty('gradlestart.bouncerServer', 'com.gtnewhorizons.retrofuturabootstrap.Main')
    task.extraJvmArgs.addAll(modernJvmArgs)
}

def runClient25Task = tasks.register('runClient25', RunModernJavaMinecraftTask, Distribution.CLIENT)
runClient25Task.configure { task ->
    task.description = 'Launches the deobfuscated client with your mod on Java 25'
    configureModernRun(task, Distribution.CLIENT)
}

def runServer25Task = tasks.register('runServer25', RunModernJavaMinecraftTask, Distribution.DEDICATED_SERVER)
runServer25Task.configure { task ->
    task.description = 'Launches the deobfuscated server with your mod on Java 25'
    configureModernRun(task, Distribution.DEDICATED_SERVER)
}

// ICU4J removal: pinpoint removal of exactly one dependency,
// com.ibm.icu:icu4j-core-mojang:51.2, from vanilla_minecraft.
// Runs in projectsEvaluated: strictly after the RFG afterEvaluate that adds
// the dependencies and strictly before dependency resolution.
// applyMcDependencies stays enabled; other dependencies, extendsFrom chains
// and versions are untouched.
mcpTasks.getTaskPatchDecompiledJar().configure { task ->
    task.getPatches().from(file('src/mcPatches/net/minecraft/client/gui/FontRenderer.java.patch'))
}

gradle.projectsEvaluated { g ->
    // Snooper removal: our Minecraft patch must apply AFTER Forge/FML archives
    // (RFG appends its zips in afterEvaluate, and one FML hunk anchors on the
    // 'implements IPlayerUsage' line this patch removes).
    mcpTasks.getTaskPatchDecompiledJar().configure { task ->
        task.getPatches().from(g.rootProject.file('src/mcPatches/net/minecraft/client/Minecraft.java.patch'))
        task.getPatches().from(g.rootProject.file('src/mcPatches/net/minecraft/server/integrated/IntegratedServer.java.patch'))
        task.getPatches().from(g.rootProject.file('src/mcPatches/net/minecraft/server/MinecraftServer.java.patch'))
        task.getPatches().from(g.rootProject.file('src/mcPatches/net/minecraft/server/dedicated/DedicatedServer.java.patch'))
        task.getPatches().from(g.rootProject.file('src/mcPatches/net/minecraft/client/settings/GameSettings.java.patch'))
        task.getPatches().from(g.rootProject.file('src/mcPatches/net/minecraft/client/gui/GuiOptions.java.patch'))
        task.getPatches().from(g.rootProject.file('src/mcPatches/cpw/mods/fml/common/asm/FMLSanityChecker.java.patch'))
        task.getPatches().from(g.rootProject.file('src/mcPatches/cpw/mods/fml/common/FMLModContainer.java.patch'))
        task.getPatches().from(g.rootProject.file('src/mcPatches/cpw/mods/fml/common/ModContainer.java.patch'))
        task.getPatches().from(g.rootProject.file('src/mcPatches/cpw/mods/fml/common/DummyModContainer.java.patch'))
        task.getPatches().from(g.rootProject.file('src/mcPatches/cpw/mods/fml/common/FMLContainer.java.patch'))
        task.getPatches().from(g.rootProject.file('src/mcPatches/cpw/mods/fml/common/InjectedModContainer.java.patch'))
        task.getPatches().from(g.rootProject.file('src/mcPatches/cpw/mods/fml/common/MinecraftDummyContainer.java.patch'))
        task.getPatches().from(g.rootProject.file('src/mcPatches/cpw/mods/fml/common/Loader.java.patch'))
        task.getPatches().from(g.rootProject.file('src/mcPatches/cpw/mods/fml/common/Mod.java.patch'))
        task.getPatches().from(g.rootProject.file('src/mcPatches/net/minecraftforge/common/ForgeModContainer.java.patch'))
    }
    // Full excision: strip the 5 deleted sources from the patched-sources jars,
    // so no downstream consumer (remap, decompress, IDE sync) ever sees them.
    // Hard lesson: stripping only the SRG jar is NOT enough — the remap task may
    // run on input cached/ordered before the strip, leaving a dirty MCP jar that
    // resurrects the files at decompress time. Hence both jars are stripped, plus
    // the 4 dead Snooper lang lines are cut from en_US.lang (mcPatches cannot
    // touch resources: the patch context covers only .java sources).
    // The file-level Delete below remains as a safety net for minecraft-src.
    def stripJar = { File jarFile ->
        def victims = [
            'net/minecraft/profiler/PlayerUsageSnooper.java',
            'net/minecraft/profiler/IPlayerUsage.java',
            'net/minecraft/client/gui/GuiSnooper.java',
            'cpw/mods/fml/common/event/FMLFingerprintViolationEvent.java',
            'cpw/mods/fml/common/CertificateHelper.java'
        ] as Set
        def deadLangKeys = [
            'options.snooper=',
            'options.snooper.view=',
            'options.snooper.title=',
            'options.snooper.desc='
        ]
        def tmp = new File(jarFile.parentFile, jarFile.name + '.stripped')
        def zin = new java.util.zip.ZipFile(jarFile)
        try {
            tmp.withOutputStream { fos ->
                def zout = new java.util.zip.ZipOutputStream(fos)
                try {
                    zin.entries().each { e ->
                        if (victims.contains(e.name)) return
                        if (!e.isDirectory() && e.name == 'assets/minecraft/lang/en_US.lang') {
                            def text = zin.getInputStream(e).getText('UTF-8')
                            def kept = text.readLines().findAll { line ->
                                !deadLangKeys.any { k -> line.startsWith(k) }
                            }
                            zout.putNextEntry(new java.util.zip.ZipEntry(e.name))
                            zout.write((kept.join('\n') + '\n').getBytes('UTF-8'))
                            zout.closeEntry()
                            return
                        }
                        zout.putNextEntry(new java.util.zip.ZipEntry(e.name))
                        if (!e.isDirectory()) {
                            zin.getInputStream(e).withCloseable { ins -> zout << ins }
                        }
                        zout.closeEntry()
                    }
                } finally { zout.close() }
            }
        } finally { zin.close() }
        if (!jarFile.delete() || !tmp.renameTo(jarFile)) {
            throw new GradleException('stripDeletedSources: could not replace ' + jarFile)
        }
    }
    def stripDeletedSources = g.rootProject.tasks.register('stripDeletedSources') {
        dependsOn(mcpTasks.getTaskPatchDecompiledJar())
        doLast {
            stripJar(mcpTasks.getTaskPatchDecompiledJar().get().getOutputJar().get().getAsFile())
        }
    }
    mcpTasks.getTaskRemapDecompiledJar().configure { t -> t.dependsOn(stripDeletedSources) }
    def stripMcpSources = g.rootProject.tasks.register('stripMcpSources') {
        dependsOn(mcpTasks.getTaskRemapDecompiledJar())
        doLast {
            stripJar(mcpTasks.getTaskRemapDecompiledJar().get().getOutputJar().get().getAsFile())
        }
    }
    mcpTasks.getTaskDecompressDecompiledSources().configure { t -> t.dependsOn(stripMcpSources) }
    // Snooper removal: physically delete the 3 Snooper sources after decompress.
    // mcPatches cannot delete files (proven via RFG sources: ContextualPatch DELETE
    // mode leaves a 0-byte entry via fileMap.put). This task has no outputs, so it
    // is never UP-TO-DATE-skipped (a doLast on the Copy task would be skipped).
    // Fingerprint removal: same mechanism deletes the 2 fingerprint-only files.
    def deleteSnooperSources = g.rootProject.tasks.register('deleteSnooperSources', Delete) {
        dependsOn(mcpTasks.getTaskDecompressDecompiledSources())
        delete(
            g.rootProject.file('build/rfg/minecraft-src/java/net/minecraft/profiler/PlayerUsageSnooper.java'),
            g.rootProject.file('build/rfg/minecraft-src/java/net/minecraft/profiler/IPlayerUsage.java'),
            g.rootProject.file('build/rfg/minecraft-src/java/net/minecraft/client/gui/GuiSnooper.java'),
            g.rootProject.file('build/rfg/minecraft-src/java/cpw/mods/fml/common/event/FMLFingerprintViolationEvent.java'),
            g.rootProject.file('build/rfg/minecraft-src/java/cpw/mods/fml/common/CertificateHelper.java')
        )
    }
    mcpTasks.getTaskBuildPatchedMc().configure { t -> t.dependsOn(deleteSnooperSources) }
    def cfg = g.rootProject.configurations.findByName('vanilla_minecraft')
    if (cfg == null) {
        throw new GradleException("ICU removal: configuration 'vanilla_minecraft' not found")
    }
    def icu = cfg.dependencies.findAll { d ->
        d.group == 'com.ibm.icu' && d.name == 'icu4j-core-mojang' && d.version == '51.2'
    }
    if (icu.size() != 1) {
        throw new GradleException("ICU removal: expected exactly 1 ICU dependency, found ${icu.size()}: ${icu}")
    }
    int before = cfg.dependencies.size()
    cfg.dependencies.removeAll(icu)
    int after = cfg.dependencies.size()
    if (after != before - 1) {
        throw new GradleException("ICU removal: expected exactly one removal (${before} -> ${after})")
    }
    if (cfg.dependencies.any { d -> d.group == 'com.ibm.icu' }) {
        throw new GradleException('ICU removal: ICU dependency still present after removal')
    }
}
