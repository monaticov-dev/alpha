import com.gtnewhorizons.retrofuturagradle.mcp.MCPTasks
import com.gtnewhorizons.retrofuturagradle.minecraft.MinecraftTasks
import com.gtnewhorizons.retrofuturagradle.minecraft.RunMinecraftTask
import com.gtnewhorizons.retrofuturagradle.util.Distribution

import javax.inject.Inject

/**
 * Thin RunMinecraftTask subclass for Java 25 launches,
 * mirroring GTNHGradle's RunHotswappableMinecraftTask.
 */
abstract class RunModernJavaMinecraftTask extends RunMinecraftTask {
    @Inject
    RunModernJavaMinecraftTask(Distribution side, Gradle gradle) {
        super(side, gradle)
    }
}

plugins {
    id 'java-library'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.3'
}

group = 'com.alpha'
version = '1.0.0'

// The mod compiles with Java 8 for compatibility with all 1.7.10 servers.
// The JDK is auto-provisioned via the foojay-resolver plugin in settings.gradle.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
        vendor = JvmVendorSpec.AZUL
    }
}

// Main RFG configuration, see JavaDoc com.gtnewhorizons.retrofuturagradle.MinecraftExtension
minecraft {
    mcVersion = '1.7.10'

    // Username for client launch configurations
    username = 'Developer'

    // Latest LWJGL3 matching the bundled lwjgl3ify
    lwjgl3Version = '3.4.2'

    // Bindings proven required by lwjgl3ify 3.0.31 references (openal
    // for sound, opengl for render, jemalloc as the LWJGL3 default allocator,
    // stb for texture stitching, sdl for the event loop/text input, spng for
    // image loading). glfw and tinyfd are intentionally omitted: zero references
    // in lwjgl3ify 3.0.31 sources (verified against the -sources jar).
    lwjgl3Bindings = ['openal', 'opengl', 'jemalloc', 'stb', 'sdl', 'spng']

    // Generate VERSION/MOD_ID fields in the injected Tags class
    injectedTags.put('VERSION', project.version)
    injectedTags.put('MOD_ID', 'alpha')

    // Enable assertions in the mod package on client/server launches
    extraRunJvmArguments.add("-ea:${project.group}")
}

// Generates the com.alpha.Tags class with the mod version
tasks.injectTags.configure {
    outputClassName = "${project.group}.Tags"
}

// Substitutes the gradle version into mcmod.info
tasks.processResources.configure {
    def projVersion = project.version.toString() // Needed for configuration cache
    inputs.property('version', projVersion)
    filesMatching('mcmod.info') {
        expand(modVersion: projVersion)
    }
}

repositories {
    maven {
        name = 'GTNH Maven'
        url = 'https://nexus.gtnewhorizons.com/repository/public/'
    }
}

configurations {
    // Additional runtime for modern Java (17+): lwjgl3ify and its dependencies
    modernJavaDependencies {
        description = 'Additional runtime dependencies for running on Java 17+'
        extendsFrom configurations.runtimeClasspath
        canBeConsumed = false
        canBeResolved = true
    }
    // lwjgl3ify forgePatches jar must come first on modern-Java launch classpaths
    modernJavaPatchDependencies {
        description = 'Classpath-first patches for running on Java 17+'
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    // lwjgl3ify: brings LWJGL3 and Java 17+ support to Minecraft 1.7.10 (pulls UniMixins transitively)
    modernJavaDependencies 'com.github.GTNewHorizons:lwjgl3ify:3.0.31'
    modernJavaPatchDependencies('com.github.GTNewHorizons:lwjgl3ify:3.0.31:forgePatches') {
        transitive = false
    }
}

// ---------------------------------------------------------------------------
// Java 25 launch tasks (same mechanism as GTNHGradle runClient25):
// lwjgl3ify patches + RetroFuturaBootstrap + --add-opens JVM arguments.
// ---------------------------------------------------------------------------

// JVM arguments required to run 1.7.10 on modern Java (Java 17+ incl. 25)
